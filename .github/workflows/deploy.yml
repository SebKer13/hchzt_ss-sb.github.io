name: Build, verschlüsseln & deployen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Ruby einrichten
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Jekyll bauen
        run: |
          gem install bundler jekyll
          jekyll build

      - name: Node einrichten (für Pagecrypt)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Seite mit Pagecrypt verschlüsseln
        run: |
          npm install -g @pagecrypt/core
          # Alle HTML-Dateien verschlüsseln
          find _site -name "*.html" -type f | while read file; do
            pagecrypt "$file" "$file" --password "$SITE_PASSWORD"
          done
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
